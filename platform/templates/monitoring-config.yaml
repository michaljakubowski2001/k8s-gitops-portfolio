# Grafana's admin secret and dashboards must exist before the chart starts Grafana.
# node-exporter needs host PID, network and filesystem, so this namespace is
# the only one that cannot enforce the restricted Pod Security level.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "platform.syncPolicy" (dict "options" (list "CreateNamespace=true") "labels" (dict "pod-security.kubernetes.io/enforce" "privileged")) | nindent 2 }}
