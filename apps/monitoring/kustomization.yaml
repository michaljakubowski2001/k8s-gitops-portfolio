apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-admin.sealedsecret.yaml
configMapGenerator:
  # Picked up by the Grafana dashboard sidecar through its label.
  - name: dashboard-platform
    files:
      - dashboards/platform.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
