apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.1
    helm:
      valuesObject:
        deployment:
          replicas: 1
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesIngress:
            enabled: true
            # A NodePort has no load-balancer address to publish. Report the
            # loopback address instead so Ingresses become Healthy in Argo CD.
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
          kubernetesCRD:
            enabled: false
        ports:
          web:
            nodePort: 30080
          websecure:
            expose:
              default: false
        service:
          spec:
            type: NodePort
        metrics:
          prometheus:
            serviceMonitor:
              enabled: false
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  {{- include "platform.syncPolicy" (dict "options" (list "CreateNamespace=true") "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
