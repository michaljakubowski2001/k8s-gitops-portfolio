apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        # kubeseal looks for this name by default.
        fullnameOverride: sealed-secrets-controller
        # The sealing key is restored by scripts/bootstrap.sh before the
        # controller starts, so secrets in Git survive a cluster rebuild.
        keyrenewperiod: "0"
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
