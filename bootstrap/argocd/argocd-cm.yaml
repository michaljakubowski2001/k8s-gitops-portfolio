apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Poll Git every minute instead of the default three.
  timeout.reconciliation: 60s
  # Restore health for Application resources so app-of-apps sync waves
  # wait for each child to become Healthy before starting the next wave.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
